[project]
name = "mothusi-backend"
version = "1.0.0"
description = "Mothusi: a multi-agent classroom colleague for Grades 1–4 teachers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "langgraph>=0.6",
    "openai>=2.54.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
