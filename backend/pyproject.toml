[project]
name = "mothusi-backend"
version = "1.0.0"
description = "Mothusi: a multi-agent classroom colleague for Grades 1–4 teachers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "langgraph>=0.6",
    "openai>=2.54.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "api*", "llm*", "models*", "orchestration*", "scripts*", "storage*", "tools*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
